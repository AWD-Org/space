name: Improvement
description: Something that already exists and should be better (performance, clarity, polish)
labels: ["type: improvement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What gets better for people using Space once this is ready.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A verifiable list; it also feeds the tests.
      placeholder: "- [ ] Given… when… then…"
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options: ["S (half a day)", "M (1 to 2 days)", "L (more than 2 days; consider splitting)"]
