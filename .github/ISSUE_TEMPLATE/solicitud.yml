name: Solicitud (intake)
description: Una idea, petición de cliente o necesidad que aún no está definida
labels: ["tipo: solicitud"]
body:
  - type: textarea
    id: necesidad
    attributes:
      label: Qué se necesita y por qué
      description: Cuenta el problema, no la solución. ¿Qué no se puede hacer hoy?
    validations:
      required: true
  - type: input
    id: origen
    attributes:
      label: Quién lo pidió
      placeholder: "Cliente, equipo o usuario"
  - type: dropdown
    id: urgencia
    attributes:
      label: Urgencia percibida
      options: ["Puede esperar", "Esta semana", "Bloquea a alguien hoy"]
  - type: textarea
    id: ejemplo
    attributes:
      label: Ejemplo concreto
      description: Un caso real (por ejemplo, qué vende la tienda) ayuda a decidir el alcance.
