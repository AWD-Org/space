name: Smoke tests

# Runs against dev/staging only (never production). Failures open a `type: bug`
# issue that the project auto-add moves into the Bugs view.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [chore/smoke-monitoring] # temporary, to validate the run before it reaches main
    paths: [".github/smoke/**", ".github/workflows/smoke.yml"]

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: .github/smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run smoke tests
        working-directory: .github/smoke
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://dev--eclectic-genie-8199e5.netlify.app' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node smoke.mjs
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: .github/smoke/smoke-results
          if-no-files-found: ignore
